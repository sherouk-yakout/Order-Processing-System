<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Bookstore</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/main.js" defer></script>
  <script src="js/login.js" defer></script>

  <style>
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 85vh;
      padding: 20px;
    }

    .glass-card {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px);
      box-shadow: 0 6px 25px var(--shadow);
      animation: fadeIn 0.6s ease;
    }
    body.dark-theme .glass-card {
      background: rgba(40, 40, 40, 0.45);
    }

    .auth-title {
      text-align: center;
      margin-bottom: 25px;
      font-size: 1.8rem;
      font-weight: bold;
    }

    .extra-links {
      margin-top: 15px;
      text-align: center;
      font-size: 0.9rem;
    }
    .extra-links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .extra-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<div id="toast" class="toast"></div>

<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <button class="btn secondary-btn back-btn">⬅ Back</button>
    <a href="index.html" class="logo">📚 Bookstore</a>
    <button id="themeToggle" class="btn secondary-btn">🌙 Dark Mode</button>
  </nav>

  <!-- LOGIN FORM WRAPPER -->
  <main class="container auth-container">
    <div class="glass-card">

      <h2 class="auth-title">🔐 Login</h2>

      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required />

        <div class="password-field">
          <input type="password" id="loginPassword" placeholder="Password" required />
          <span class="toggle-eye" data-target="loginPassword">👁</span>
        </div>

        <button class="btn primary-btn" style="width: 100%;">Login</button>
      </form>

      <div class="extra-links">
        <p>Don't have an account? <a href="signup.html">Create one →</a></p>
      </div>

    </div>
  </main>

  <footer class="footer">© 2025 Bookstore</footer>
</body>
</html>
