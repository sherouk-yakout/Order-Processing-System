<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Bookstore</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="js/main.js" defer></script>
  <script src="js/login.js" defer></script>

  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }
    body.dark-theme {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }

    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 80px);
      padding: 20px;
    }

    .glass-card {
      width: 100%;
      max-width: 450px;
      padding: 48px 40px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.5s ease-out;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    body.dark-theme .glass-card {
      background: rgba(30, 30, 46, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .auth-title {
      text-align: center;
      margin-bottom: 8px;
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .auth-subtitle {
      text-align: center;
      margin-bottom: 32px;
      font-size: 0.95rem;
      color: #666;
      font-weight: 400;
    }
    body.dark-theme .auth-subtitle {
      color: #aaa;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text);
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
      background: var(--card);
      color: var(--text);
      font-size: 0.95rem;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
    }
    body.dark-theme .form-group input {
      border-color: #404040;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(75, 123, 236, 0.1);
    }

    .password-field {
      position: relative;
    }

    .password-field input {
      padding-right: 50px;
    }

    .toggle-eye {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 1.2rem;
      user-select: none;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .toggle-eye:hover {
      opacity: 1;
    }

    .btn-primary-login {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      margin-top: 8px;
    }

    .btn-primary-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }

    .btn-primary-login:active {
      transform: translateY(0);
    }

    .extra-links {
      margin-top: 24px;
      text-align: center;
      font-size: 0.9rem;
    }
    .extra-links p {
      color: #666;
      margin-bottom: 8px;
    }
    body.dark-theme .extra-links p {
      color: #aaa;
    }
    .extra-links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
    }
    .extra-links a:hover {
      text-decoration: underline;
      color: var(--accent-hover);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: #999;
      font-size: 0.85rem;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e0e0e0;
    }
    body.dark-theme .divider::before,
    body.dark-theme .divider::after {
      background: #404040;
    }
    .divider span {
      padding: 0 16px;
    }

    .navbar {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    body.dark-theme .navbar {
      background: rgba(0, 0, 0, 0.2);
    }

    .navbar .logo {
      color: white;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .navbar .btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .navbar .btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<div id="toast" class="toast"></div>

<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <button class="btn secondary-btn back-btn" onclick="window.history.back()">← Back</button>
    <a href="index.html" class="logo">📚 Bookstore</a>
    <button id="themeToggle" class="btn secondary-btn">🌙</button>
  </nav>

  <!-- LOGIN FORM WRAPPER -->
  <main class="container auth-container">
    <div class="glass-card">
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Sign in to continue to your account</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input 
            type="email" 
            id="loginEmail" 
            placeholder="you@example.com" 
            required 
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="password-field">
            <input 
              type="password" 
              id="loginPassword" 
              placeholder="Enter your password" 
              required 
              autocomplete="current-password"
            />
            <span class="toggle-eye" data-target="loginPassword">👁</span>
          </div>
        </div>

        <button type="submit" class="btn-primary-login">Sign In</button>
      </form>

      <div class="extra-links">
        <p>Don't have an account? <a href="signup.html">Create one →</a></p>
      </div>
    </div>
  </main>

  <footer class="footer" style="color: rgba(255,255,255,0.8);">© 2025 Bookstore. All rights reserved.</footer>
</body>
</html>
