<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login / Signup - Bookstore</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body class="light-theme">

  <nav class="navbar">
    <button class="btn secondary-btn back-btn">⬅ Back</button>
    <a href="index.html" class="logo">📚 Bookstore</a>
    <button id="themeToggle" class="btn secondary-btn">🌙 Dark Mode</button>
  </nav>

  <main class="container">
    <div class="auth-wrapper">

      <div class="form-toggle">
        <button id="loginTab" class="btn primary-btn active">Login</button>
        <button id="signupTab" class="btn secondary-btn">Sign Up</button>
      </div>

      <!-- LOGIN -->
      <form id="loginForm" class="auth-form">
        <h2>🔐 Login</h2>

        <input type="email" id="loginEmail" placeholder="Email" required />

        <div class="password-field">
          <input type="password" id="loginPassword" placeholder="Password" required />
          <span class="toggle-eye" data-target="loginPassword">👁</span>
        </div>

        <button class="primary-btn">Login</button>
      </form>

      <!-- SIGNUP -->
      <form id="signupForm" class="auth-form hidden">
        <h2>📝 Sign Up</h2>

        <input type="text" id="signupName" placeholder="Full Name" required />
        <input type="email" id="signupEmail" placeholder="Email" required />

        <div class="password-field">
          <input type="password" id="signupPassword" placeholder="Password" required />
          <span class="toggle-eye" data-target="signupPassword">👁</span>
        </div>

        <p id="passwordStrength"></p>

        <button class="primary-btn">Create Account</button>
      </form>

    </div>
  </main>

  <footer class="footer">© 2025 Bookstore</footer>

  <!-- SCRIPTS ONLY HERE -->
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
