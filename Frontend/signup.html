<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Bookstore</title>

  <link rel="stylesheet" href="css/style.css" />
  <script src="js/main.js" defer></script>
  <script src="js/signup.js" defer></script>

  <style>
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 85vh;
      padding: 20px;
    }

    .glass-card {
      width: 100%;
      max-width: 450px;
      padding: 35px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px);
      box-shadow: 0 6px 25px var(--shadow);
      animation: fadeIn 0.6s ease;
    }
    body.dark-theme .glass-card {
      background: rgba(40, 40, 40, 0.45);
    }

    .auth-title {
      text-align: center;
      margin-bottom: 25px;
      font-size: 1.8rem;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <button class="btn secondary-btn back-btn">⬅ Back</button>
    <a href="index.html" class="logo">📚 Bookstore</a>
    <button id="themeToggle" class="btn secondary-btn">🌙 Dark Mode</button>
  </nav>

  <main class="container auth-container">
    <div class="glass-card">

      <h2 class="auth-title">📝 Create Account</h2>

      <form id="signupForm">

        <input type="text" id="signupUsername" placeholder="Username" required />
        <input type="text" id="signupFirstName" placeholder="First Name" required />
        <input type="text" id="signupLastName" placeholder="Last Name" required />
        <input type="email" id="signupEmail" placeholder="Email" required />
        <input type="text" id="signupPhone" placeholder="Phone Number" required />
        <textarea id="signupAddress" placeholder="Shipping Address" required></textarea>

        <div class="password-field">
          <input type="password" id="signupPassword" placeholder="Password" required />
          <span class="toggle-eye" data-target="signupPassword">👁</span>
        </div>

        <p id="passwordStrength"></p>

        <button class="btn primary-btn" style="width: 100%;">Create Account</button>
      </form>

      <div class="extra-links">
        <p>Already have an account? <a href="login.html">Login →</a></p>
      </div>

    </div>
  </main>

  <footer class="footer">© 2025 Bookstore</footer>
</body>
</html>
