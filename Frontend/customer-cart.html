<!DOCTYPE html>
<html>
  <head>
    <title>Your Cart</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/main.js" defer></script>
    <script src="js/customer-cart.js" defer></script>
  </head>

  <body onload="requireAuth('customer')">
    <nav class="navbar">
      <a href="customer-dashboard.html" class="logo">📚 Bookstore</a>
      <button id="themeToggle" class="btn secondary-btn">🌙 Dark Mode</button>
      <ul class="nav-links">
        <li><a href="customer-search.html">Search</a></li>
        <li><a href="customer-orders.html">Orders</a></li>
        <li><a href="customer-account.html">Account</a></li>

        <li><a href="#" class="nav-link logout" id="logoutBtn">Logout</a></li>
      </ul>
    </nav>

    <main class="container fade-in">
      <h2>🛒 Your Shopping Cart</h2>

      <div id="cartContainer" class="cart-grid"></div>

      <div id="cartSummary" class="summary-card hidden">
        <h3>Total: $<span id="totalPrice">0</span></h3>
        <button class="btn primary-btn" onclick="openCheckout()">
          Proceed to Checkout 💳
        </button>
      </div>

      <div id="checkoutModal" class="modal hidden">
        <div class="modal-content">
          <h3>💳 Checkout</h3>

        <div class="card-input-wrapper">
  <input
    type="text"
    id="creditCardNumber"
    placeholder="Card Number"
    maxlength="19"
  />
  <span id="cardType" class="card-type"></span>
</div>




          <input type="text" id="expiry" placeholder="Expiry (MM/YY)" />
          <p id="checkoutError" class="error-msg"></p>

          <button class="btn primary-btn" onclick="checkout()">
            Confirm Payment
          </button>
          <button class="btn secondary-btn" onclick="closeCheckout()">
            Cancel
          </button>
        </div>
      </div>
    </main>

    <footer class="footer">© 2025 Bookstore</footer>
    <script>
      document
        .getElementById("logoutBtn")
        ?.addEventListener("click", function (e) {
          e.preventDefault();

          localStorage.removeItem("user_id");
          localStorage.removeItem("username");
          localStorage.removeItem("role");

          window.location.href = "./login.html";
        });
    </script>
  </body>
</html>
