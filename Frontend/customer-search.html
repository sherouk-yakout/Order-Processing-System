<!DOCTYPE html>
<html>
<head>
  <title>Search Books</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
  <script src="js/customer-search.js" defer></script>
</head>

<body onload="requireAuth('customer')">

  <nav class="navbar">
    <a href="customer-dashboard.html" class="logo">📚 Bookstore</a>
    <button id="themeToggle" class="btn secondary-btn">🌙 Dark Mode</button>
    <a href="#" class="nav-link logout" id="logoutBtn">Logout</a>

  </nav>

  <main class="container fade-in">

    <h2>🔍 Search Books</h2>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search by title, author, ISBN, publisher…">

      <select id="categoryFilter">
        <option value="">All Categories</option>
        <option>Fiction</option>
        <option>Science</option>
        <option>Technology</option>
        <option>Business</option>
        <option>Kids</option>
        <option>Comics</option>
      </select>
    </div>

    <div id="loadingSkeleton" class="skeleton-grid hidden"></div>

    <div id="searchResults" class="search-grid"></div>

  </main>

  <footer class="footer">© 2025 Bookstore</footer>
  <script>
      document
        .getElementById("logoutBtn")
        ?.addEventListener("click", function (e) {
          e.preventDefault();

          localStorage.removeItem("user_id");
          localStorage.removeItem("username");
          localStorage.removeItem("role");

          window.location.href = "./login.html";
        });
    </script>

</body>
</html>
